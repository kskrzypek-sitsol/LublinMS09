<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18392b">
    <title>Finish Line</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <div>
                <p class="eyebrow">Race day</p>
                <h1>Finish Line</h1>
            </div>
            <div class="player-count" aria-live="polite">
                <strong id="player-count">0</strong>
                <span>of 8 runners</span>
            </div>
        </header>

        <section class="setup-panel" aria-labelledby="setup-heading">
            <div class="setup-copy">
                <h2 id="setup-heading">Starting roster</h2>
                <p>Add 2-8 players, then send them to the track.</p>
            </div>

            <form id="player-form" class="player-form" novalidate>
                <label for="player-name">Player name</label>
                <div class="input-row">
                    <input id="player-name" name="playerName" type="text" maxlength="30" autocomplete="off" placeholder="Enter a name" aria-describedby="form-message">
                    <button id="add-player" type="submit">Add Player</button>
                </div>
                <p id="form-message" class="form-message" aria-live="polite">Add at least 2 players to race.</p>
            </form>

            <div class="roster-wrap">
                <h3>Players</h3>
                <ol id="player-list" class="player-list" aria-label="Player roster"></ol>
            </div>

            <button id="start-race" class="start-button" type="button" disabled>
                <span aria-hidden="true">🏁</span>
                Start Race
            </button>
        </section>

        <section class="race-section" aria-labelledby="track-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Main event</p>
                    <h2 id="track-heading">The track</h2>
                </div>
                <p id="race-status" class="race-status" aria-live="polite">Waiting for runners</p>
            </div>
            <div id="race-track" class="race-track empty" aria-label="Horse race track">
                <div class="empty-track-message">
                    <span aria-hidden="true">♞</span>
                    <p>Added players appear here.</p>
                </div>
            </div>
        </section>

        <section id="results" class="results" aria-labelledby="results-heading" hidden>
            <p class="eyebrow">Official result</p>
            <h2 id="results-heading">Final classification</h2>
            <ol id="classification" class="classification"></ol>
        </section>
    </main>
</body>
</html>
