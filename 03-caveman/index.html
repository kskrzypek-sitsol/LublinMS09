<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caveman Horse Derby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <div class="sky-glow sky-glow-left"></div>
        <div class="sky-glow sky-glow-right"></div>

        <main class="game-frame">
            <section class="hero-card">
                <p class="eyebrow">Multiple players. One wild sprint.</p>
                <h1>Caveman Horse Derby</h1>
                <p class="hero-copy">Type 2 to 4 racer names. Hit start. Watch the horses fight the finish line.</p>

                <form id="setup-form" class="setup-card">
                    <div class="input-grid">
                        <label class="field">
                            <span>Racer 1</span>
                            <input type="text" name="player" maxlength="18" placeholder="Luna" autocomplete="off">
                        </label>
                        <label class="field">
                            <span>Racer 2</span>
                            <input type="text" name="player" maxlength="18" placeholder="Blaze" autocomplete="off">
                        </label>
                        <label class="field">
                            <span>Racer 3</span>
                            <input type="text" name="player" maxlength="18" placeholder="Comet" autocomplete="off">
                        </label>
                        <label class="field">
                            <span>Racer 4</span>
                            <input type="text" name="player" maxlength="18" placeholder="Storm" autocomplete="off">
                        </label>
                    </div>

                    <div class="controls-row">
                        <button id="start-button" type="submit" class="primary-button">Start Race</button>
                        <p id="setup-message" class="setup-message">Need 2 to 4 names.</p>
                    </div>
                </form>
            </section>

            <section class="stadium-card">
                <div class="race-header">
                    <div>
                        <p class="label">Track status</p>
                        <h2 id="status-text">Waiting for racers</h2>
                    </div>
                    <div id="countdown-chip" class="countdown-chip">-</div>
                </div>

                <div class="track-shell">
                    <div class="track-banner">
                        <span>Dirt track</span>
                        <span class="finish-flag">Finish line ahead</span>
                    </div>
                    <div id="race-track" class="race-track" aria-live="polite"></div>
                </div>
            </section>
        </main>

        <section id="result-panel" class="result-panel hidden" aria-live="assertive">
            <div class="result-card">
                <p class="label">Winner</p>
                <h2 id="winner-name">Nobody yet</h2>
                <p id="winner-copy" class="winner-copy">Set the racers and begin.</p>
                <button id="restart-button" type="button" class="primary-button">Restart Race</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
