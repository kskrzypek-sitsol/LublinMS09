<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e94f37" />
  <title>Finish Line</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="masthead">
      <p class="eyebrow">LOCAL DERBY</p>
      <h1>Finish Line</h1>
      <p class="tagline">Pick. Race. Win.</p>
    </header>

    <section class="setup-panel" id="setup-panel" aria-labelledby="setup-title">
      <div class="section-heading">
        <p class="eyebrow">RACE SETUP</p>
        <h2 id="setup-title">Who is riding?</h2>
      </div>
      <fieldset class="player-count">
        <legend>Number of riders</legend>
        <button class="count-button active" type="button" data-count="2" aria-pressed="true">2</button>
        <button class="count-button" type="button" data-count="3" aria-pressed="false">3</button>
        <button class="count-button" type="button" data-count="4" aria-pressed="false">4</button>
      </fieldset>
      <div class="name-fields" id="name-fields"></div>
      <button class="primary-button" id="start-button" type="button">Start race <span aria-hidden="true">→</span></button>
    </section>

    <section class="race-panel hidden" id="race-panel" aria-labelledby="race-title">
      <div class="race-topbar">
        <div>
          <p class="eyebrow">LIVE RACE</p>
          <h2 id="race-title">To the finish</h2>
        </div>
        <p class="race-status" id="race-status" aria-live="polite">Horses ready.</p>
      </div>

      <div class="track" id="track" aria-label="Horse race track"></div>
      <div class="race-controls">
        <button class="race-button" id="race-button" type="button">GOGOGOGO</button>
      </div>
    </section>
  </main>
  <dialog class="winner-dialog" id="winner-dialog" aria-labelledby="winner-title">
    <div class="winner-mark" aria-hidden="true">WIN</div>
    <p class="eyebrow">RACE COMPLETE</p>
    <h2 id="winner-title"><span id="winner-name">Player 1</span> wins!</h2>
    <p id="winner-copy">First across the line.</p>
    <div class="dialog-actions">
      <button class="primary-button" id="replay-button" type="button">Race again</button>
      <button class="secondary-button" id="setup-button" type="button">New riders</button>
    </div>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
