<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Downs Derby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="masthead">
      <p class="eyebrow">Est. 2026 · Race Day</p>
      <h1>Sunny Downs <span>Derby</span></h1>
      <p class="subtitle">One quick race. One glorious finish.</p>
    </header>

    <section class="entry-panel" aria-labelledby="players-title">
      <div>
        <p class="section-kicker">The starting gate</p>
        <h2 id="players-title">Name the jockeys</h2>
      </div>
      <div class="name-controls">
        <label class="sr-only" for="player-name">Player name</label>
        <input id="player-name" type="text" maxlength="18" placeholder="Player name" autocomplete="off">
        <button id="add-player" type="button">Add Player</button>
      </div>
      <p id="player-message" class="message" aria-live="polite">Add 2 to 6 players to open the gates.</p>
      <ol id="player-list" class="player-list" aria-label="Players"></ol>
    </section>

    <section class="race-panel" aria-labelledby="race-title">
      <div class="race-topline">
        <div>
          <p class="section-kicker">Main event</p>
          <h2 id="race-title">The race track</h2>
        </div>
        <button id="start-race" class="start-button" type="button" disabled>Start Race</button>
      </div>
      <div class="track-frame">
        <div class="finish-banner" aria-hidden="true"><span>FINISH</span></div>
        <div id="race-track" class="race-track" aria-live="polite">
          <p class="track-empty">Add your racers. The turf awaits.</p>
        </div>
      </div>
    </section>

    <section id="results-panel" class="results-panel" hidden aria-labelledby="results-title">
      <p class="section-kicker">Official result</p>
      <h2 id="results-title">Final classification</h2>
      <ol id="classification" class="classification"></ol>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
