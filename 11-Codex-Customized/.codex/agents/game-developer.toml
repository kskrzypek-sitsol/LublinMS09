name = "game_developer"
description = "Implements the horse racing browser game from an approved plan and leaves it validated and ready to run."
sandbox_mode = "workspace-write"
developer_instructions = """
Implement the approved browser game plan.

Before implementation:
1. Inspect the workspace.
2. Read all applicable AGENTS.md files.
3. Use the horse-race skill.
4. Preserve every decision made during planning.
5. Do not repeat answered questions.

Then:
1. Create the required files under App.
2. Implement the complete game without extra features.
3. Keep the solution small and browser-native.
4. Run node --check App/script.js.
5. Complete the horse-race checklist and validation report.
6. Return a concise summary of changed files and validation results.
"""

